name: Ingestion

# Collecte réelle des données. Stockage provisoire GRATUIT : la base SQLite est conservée d'un run à l'autre
# via le cache GitHub Actions (éviction après 7 jours sans run) et publiée en artefact téléchargeable.
# Remplacement prévu : PostgreSQL (Railway) en phase 7, après validation du coût.

on:
  workflow_dispatch:
    inputs:
      what:
        description: "Données à collecter"
        default: all
        type: choice
        options: [all, prices, fundamentals, macro, earnings]
  schedule:
    # Après les clôtures US de lun–ven. Deux passages car l'univers (58 symboles) dépasse
    # le quota Tiingo Free de 50 req/h : le 2e run termine les symboles restants.
    # GitHub retarde souvent les tâches planifiées (jusqu'à plusieurs heures) : plusieurs créneaux à des minutes
    # « creuses ». Un passage inutile ne coûte rien : séries déjà à jour ignorées, scan déjà fait non refait.
    - cron: "17 23 * * 1-5"
    - cron: "37 0 * * 2-6"
    - cron: "7 3 * * 2-6"
    - cron: "47 5 * * 2-6"

concurrency:
  group: ingestion          # jamais deux ingestions en parallèle sur la même base
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: Variables
    timeout-minutes: 60
    env:
      # Base de production (PostgreSQL Railway) si le secret existe, sinon SQLite du cache.
      SH_DATABASE_URL: ${{ secrets.SH_DATABASE_URL || 'sqlite:///var/stockhunter.db' }}
      SH_CACHE_DIR: var/cache
      SH_SEC_USER_AGENT: ${{ secrets.SH_SEC_USER_AGENT }}
      SH_TIINGO_API_KEY: ${{ secrets.SH_TIINGO_API_KEY }}
      SH_FRED_API_KEY: ${{ secrets.SH_FRED_API_KEY }}
      SH_FINNHUB_API_KEY: ${{ secrets.SH_FINNHUB_API_KEY }}
      SH_MASSIVE_API_KEY: ${{ secrets.SH_MASSIVE_API_KEY }}
      SH_TELEGRAM_BOT_TOKEN: ${{ secrets.SH_TELEGRAM_BOT_TOKEN }}
      SH_TELEGRAM_CHAT_ID: ${{ secrets.SH_TELEGRAM_CHAT_ID }}
      SH_MARKET_DIR: var/market
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[postgres]"

      - name: Restaurer la base
        uses: actions/cache/restore@v5
        with:
          path: var
          key: stockhunter-db-${{ github.run_id }}
          restore-keys: stockhunter-db-

      - name: Migrations
        run: stockhunter init-db

      - name: Chaîne nocturne (collecte → qualité → sélection → simulation → suivi → rapports)
        id: pipeline
        # Toutes les étapes s'exécutent et sont consignées ; la commande sort en erreur si une étape critique a
        # échoué. `continue-on-error` laisse la sauvegarde du cache se faire, puis l'étape finale rend le job rouge.
        continue-on-error: true
        run: stockhunter pipeline nightly

      - name: Rapport
        if: always()
        run: |
          {
            echo '## StockHunter — classement'
            echo '```'
            stockhunter top -n 15 || true
            echo '```'
            echo '## État des données'
            echo '```'
            stockhunter status
            echo
            stockhunter prices SPY -n 5 || true
            echo
            stockhunter market status || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          stockhunter status

      - name: Sauvegarder la base
        if: always()
        uses: actions/cache/save@v5
        with:
          path: var
          key: stockhunter-db-${{ github.run_id }}

      # Pas d'artefact contenant la base ou les cours : le dépôt est public et les licences Tiingo / Massive
      # interdisent la redistribution. Les données restent dans le cache Actions et la base Railway.

      - name: Échec si une étape critique de la chaîne a échoué
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::Une étape critique de la chaîne nocturne a échoué (voir l'étape « Chaîne nocturne » et la page Santé du dashboard)."
          exit 1
