name: Ingestion

# Collecte réelle des données. Stockage provisoire GRATUIT : la base SQLite est conservée d'un run à l'autre
# via le cache GitHub Actions (éviction après 7 jours sans run) et publiée en artefact téléchargeable.
# Remplacement prévu : PostgreSQL (Railway) en phase 7, après validation du coût.

on:
  workflow_dispatch:
    inputs:
      what:
        description: "Données à collecter"
        default: all
        type: choice
        options: [all, prices, fundamentals, macro, earnings]
  schedule:
    # Après les clôtures US de lun–ven. Deux passages car l'univers (58 symboles) dépasse
    # le quota Tiingo Free de 50 req/h : le 2e run termine les symboles restants.
    - cron: "15 23 * * 2-6"
    - cron: "25 0 * * 3-6,0"

concurrency:
  group: ingestion          # jamais deux ingestions en parallèle sur la même base
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: Variables
    timeout-minutes: 60
    env:
      SH_DATABASE_URL: sqlite:///var/stockhunter.db
      SH_CACHE_DIR: var/cache
      SH_SEC_USER_AGENT: ${{ secrets.SH_SEC_USER_AGENT }}
      SH_TIINGO_API_KEY: ${{ secrets.SH_TIINGO_API_KEY }}
      SH_FRED_API_KEY: ${{ secrets.SH_FRED_API_KEY }}
      SH_FINNHUB_API_KEY: ${{ secrets.SH_FINNHUB_API_KEY }}
      SH_MASSIVE_API_KEY: ${{ secrets.SH_MASSIVE_API_KEY }}
      SH_TELEGRAM_BOT_TOKEN: ${{ secrets.SH_TELEGRAM_BOT_TOKEN }}
      SH_TELEGRAM_CHAT_ID: ${{ secrets.SH_TELEGRAM_CHAT_ID }}
      SH_MARKET_DIR: var/market
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Restaurer la base
        uses: actions/cache/restore@v5
        with:
          path: var
          key: stockhunter-db-${{ github.run_id }}
          restore-keys: stockhunter-db-

      - name: Migrations
        run: stockhunter init-db

      - name: Univers
        run: stockhunter sync-universe || echo "::warning::sync-universe partiel"

      - name: Ingestion
        run: stockhunter ingest ${{ inputs.what || 'all' }} || echo "::warning::ingestion partielle (quota atteint ou erreurs, voir le log)"

      - name: Univers large (séances du marché US manquantes, max 4 appels)
        run: stockhunter market sync --max-calls 4 || echo "::warning::univers large non à jour (voir le log)"

      - name: Contrôles qualité
        run: stockhunter quality || echo "::warning::anomalies critiques détectées"

      - name: Scanner (classement multicritère)
        # Ne score que si toutes les séries de prix sont à jour (sinon le 2e passage du soir s'en charge)
        run: stockhunter scan --if-new --require-fresh || echo "::warning::scan non exécuté (voir le log)"

      - name: Paper trading (plans des signaux READY, suivi des positions)
        run: stockhunter paper run || echo "::warning::paper trading en erreur"

      - name: Test prospectif (paniers hebdomadaires des facteurs pré-enregistrés)
        run: stockhunter forward record || echo "::warning::test prospectif non mis à jour"

      - name: Rapport et alertes Telegram
        run: stockhunter notify evening || echo "::warning::notifications en erreur"

      - name: Rapport
        if: always()
        run: |
          {
            echo '## StockHunter — classement'
            echo '```'
            stockhunter top -n 15 || true
            echo '```'
            echo '## État des données'
            echo '```'
            stockhunter status
            echo
            stockhunter prices SPY -n 5 || true
            echo
            stockhunter market status || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          stockhunter status

      - name: Sauvegarder la base
        if: always()
        uses: actions/cache/save@v5
        with:
          path: var
          key: stockhunter-db-${{ github.run_id }}

      - name: Publier la base (artefact)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stockhunter-db
          path: var/stockhunter.db
          retention-days: 14
