name: Générer les accès dashboard

# Produit le hachage du mot de passe et la clé de session à copier dans les variables Railway.
# Le mot de passe est lu depuis le secret SH_DASHBOARD_PASSWORD (environnement « Variables »), jamais affiché.
on:
  workflow_dispatch:

jobs:
  credentials:
    runs-on: ubuntu-latest
    environment: Variables
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Hachage
        env:
          PW: ${{ secrets.SH_DASHBOARD_PASSWORD }}
        run: |
          test ${#PW} -ge 12 || { echo "::error::secret SH_DASHBOARD_PASSWORD absent ou < 12 caractères"; exit 1; }
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, secrets
          from stockhunter.dashboard.auth import hash_password
          print("### À copier dans Railway → service web → Variables")
          print("```")
          print("SH_DASHBOARD_PASSWORD_HASH=" + hash_password(os.environ["PW"]))
          print("SH_DASHBOARD_SECRET=" + secrets.token_urlsafe(48))
          print("```")
          print("Supprimer ensuite ce run (menu ⋯ → Delete workflow run) : le hachage ne permet pas de retrouver "
                "le mot de passe, mais la clé de session doit rester privée.")
          PY
