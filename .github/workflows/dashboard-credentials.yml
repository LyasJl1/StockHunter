name: Générer les accès dashboard

# Produit le hachage du mot de passe à copier dans les variables Railway (la clé de session, elle, est générée
# directement par Railway avec ${{ secret(48) }} : elle n'apparaît jamais dans un journal).
# Le mot de passe est lu depuis le secret SH_DASHBOARD_PASSWORD (environnement « Variables »), jamais affiché.
on:
  workflow_dispatch:

jobs:
  credentials:
    runs-on: ubuntu-latest
    environment: Variables
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Hachage
        env:
          PW: ${{ secrets.SH_DASHBOARD_PASSWORD }}
        run: |
          test ${#PW} -ge 12 || { echo "::error::secret SH_DASHBOARD_PASSWORD absent ou < 12 caractères"; exit 1; }
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          from stockhunter.dashboard.auth import hash_password
          print("### À copier dans Railway → service web → Variables")
          print("```")
          print("SH_DASHBOARD_PASSWORD_HASH=" + hash_password(os.environ["PW"]))
          print("```")
          print("Le hachage scrypt ne permet pas de retrouver le mot de passe. Supprimer quand même ce run "
                "après copie (menu ⋯ → Delete workflow run).")
          PY
