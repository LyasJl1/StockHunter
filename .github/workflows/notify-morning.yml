name: Rapport du matin

# Rapport du matin : à partir de 8 h à Paris, une seule fois par jour. GitHub planifie en UTC et avec des retards
# parfois importants : plusieurs créneaux, le programme n'envoie qu'entre 8 h et 12 h (Paris) et déduplique.
on:
  schedule:
    - cron: "7 6 * * 1-5"
    - cron: "13 7 * * 1-5"
    - cron: "43 8 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Envoyer maintenant, quelle que soit l'heure"
        type: boolean
        default: false

concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    environment: Variables
    timeout-minutes: 15
    env:
      # Base de production (PostgreSQL Railway) si le secret existe, sinon SQLite du cache.
      SH_DATABASE_URL: ${{ secrets.SH_DATABASE_URL || 'sqlite:///var/stockhunter.db' }}
      SH_MARKET_DIR: var/market
      SH_TELEGRAM_BOT_TOKEN: ${{ secrets.SH_TELEGRAM_BOT_TOKEN }}
      SH_TELEGRAM_CHAT_ID: ${{ secrets.SH_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[postgres]"

      - name: Restaurer la base
        uses: actions/cache/restore@v5
        with:
          path: var
          key: stockhunter-db-${{ github.run_id }}
          restore-keys: stockhunter-db-

      - name: Migrations
        run: stockhunter init-db

      - name: Rapport et commandes Telegram
        run: stockhunter notify morning ${{ inputs.force && '--force' || '' }}

      - name: Sauvegarder la base (journal des messages)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: var
          key: stockhunter-db-${{ github.run_id }}
